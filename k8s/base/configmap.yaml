# Non-secret configuration only. Secrets live in secret.yaml (placeholders) / the real Secret created by CD.
apiVersion: v1
kind: ConfigMap
metadata:
  name: civicpulse-config
data:
  ENVIRONMENT: "base"
  LOG_LEVEL: "INFO"
  POSTGRES_USER: "civicpulse"
  POSTGRES_DB: "civicpulse"
  REDIS_URL: "redis://redis:6379/0"
  TRIAGE_PROVIDER: "rules"
  TRIAGE_TIMEOUT_SECONDS: "10"
  LLM_BASE_URL: "https://api.groq.com/openai/v1"
  LLM_MODEL: "openai/gpt-oss-20b"
  LLM_PROVIDER_LABEL: "groq"
  RATE_LIMIT_REQUESTS: "10"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  STATS_CACHE_TTL_SECONDS: "30"
  GRACEFUL_SHUTDOWN_SECONDS: "20"
  SEED_DEMO_DATA: "true"
  # frontend
  APP_ENVIRONMENT: "base"
  BACKEND_UPSTREAM: "http://backend:8000"

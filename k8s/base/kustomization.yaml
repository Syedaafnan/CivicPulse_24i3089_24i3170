apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: civicpulse          # everything in civicpulse, never default
labels:
  - pairs:
      app.kubernetes.io/part-of: civicpulse
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml
  - vpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

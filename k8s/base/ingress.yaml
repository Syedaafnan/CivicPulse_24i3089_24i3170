# One host: / → frontend, /api → backend. The browser sees a single origin, so no CORS is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicpulse
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"   # > 2 LLM attempts x 10 s + jitter
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
spec:
  ingressClassName: nginx
  rules:
    - host: civicpulse.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }

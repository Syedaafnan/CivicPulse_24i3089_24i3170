# PLACEHOLDERS ONLY. Never put a real value in this file (base64 is encoding, not encryption).
# It documents the Secret's shape. Both overlays delete it and the real Secret is created
# BEFORE the first apply (scripts/kind-up.sh locally, cd.yml from GitHub Secrets):
#   kubectl -n civicpulse create secret generic civicpulse-secrets \
#     --from-literal=POSTGRES_PASSWORD=... --from-literal=LLM_API_KEY=...
# POSTGRES_PASSWORD is used inside a URL: use [A-Za-z0-9] only (e.g. `openssl rand -hex 24`).
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  LLM_API_KEY: ""

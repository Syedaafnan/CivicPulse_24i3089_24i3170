# Production-style stack: pre-built, immutable images from GHCR — nothing is built here.
#   IMAGE_TAG=<git sha> GHCR_OWNER=<github-user-lowercase> docker compose -f compose.prod.yaml up -d
# Differences from compose.yaml (dev):
#   * image: ${IMAGE_TAG} instead of a build section → the exact bytes CI tested and scanned.
#   * no source bind mount / --reload: the container must run what is in the image, nothing else.
#   * no published ports on postgres, redis or backend: only the frontend (nginx) faces the host.
name: civicpulse-prod

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-llm}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
  LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
  LLM_PROVIDER_LABEL: ${LLM_PROVIDER_LABEL:-groq}
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-10}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
  ENVIRONMENT: production
  LOG_LEVEL: INFO

x-backend-image: &backend-image ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/civicpulse-backend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 256M }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "200mb", "--maxmemory-policy", "volatile-lru"]
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  migrate:
    image: *backend-image
    command: ["sh", "scripts/migrate.sh"]
    environment: *backend-env
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  backend:
    image: *backend-image
    restart: unless-stopped
    environment: *backend-env
    networks: [edge, internal]
    stop_grace_period: 30s      # > GRACEFUL_SHUTDOWN_SECONDS (20 s) so in-flight requests drain
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 128M }

  frontend:
    image: ghcr.io/${GHCR_OWNER}/civicpulse-frontend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: http://backend:8000
      APP_ENVIRONMENT: production
    ports: ["${HTTP_PORT:-80}:8080"]
    networks: [edge]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  ollama:
    image: ollama/ollama:0.3.14
    profiles: ["ollama"]
    restart: unless-stopped
    volumes: [ollama_models:/root/.ollama]
    networks: [edge]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3G }

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
  ollama_models:

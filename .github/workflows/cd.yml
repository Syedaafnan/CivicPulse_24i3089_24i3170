# CD — on every push to main (i.e. every merged dev → main PR):
#   test (full CI again, on the merged result) → build-push (GHCR, SBOM, cosign) → deploy-k8s (ephemeral kind)
# Every publishing/deploying job is gated by `needs:`. Deploys use the image DIGEST: immutable,
# and traceable to the commit via the `:<sha>` tag that points at the same digest.
name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read            # default for every job; jobs below widen only what they need

concurrency:
  group: cd-main
  cancel-in-progress: false  # never kill a deploy half-way

env:
  KUSTOMIZE_VERSION: "5.5.0"

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write       # push to GHCR with the scoped, auto-expiring GITHUB_TOKEN (no PAT, no password)
      id-token: write       # keyless cosign signing via GitHub OIDC
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
      backend-digest: ${{ steps.backend.outputs.digest }}
      frontend-digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: owner
        name: registry owner must be lowercase
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: backend
        name: build + push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/civicpulse-backend:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/civicpulse-backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - id: frontend
        name: build + push frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/civicpulse-frontend:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/civicpulse-frontend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: SBOM (Syft) — backend
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: ghcr.io/${{ steps.owner.outputs.owner }}/civicpulse-backend@${{ steps.backend.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-backend.spdx.json
      - name: SBOM (Syft) — frontend
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: ghcr.io/${{ steps.owner.outputs.owner }}/civicpulse-frontend@${{ steps.frontend.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-frontend.spdx.json

      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: sign both images by digest (keyless)
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
          BACKEND: ${{ steps.backend.outputs.digest }}
          FRONTEND: ${{ steps.frontend.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/$OWNER/civicpulse-backend@$BACKEND"
          cosign sign --yes "ghcr.io/$OWNER/civicpulse-frontend@$FRONTEND"
      - name: summary
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
          BACKEND: ${{ steps.backend.outputs.digest }}
          FRONTEND: ${{ steps.frontend.outputs.digest }}
        run: |
          {
            echo "### Published (commit \`${GITHUB_SHA}\`)"
            echo "- \`ghcr.io/$OWNER/civicpulse-backend@$BACKEND\`"
            echo "- \`ghcr.io/$OWNER/civicpulse-frontend@$FRONTEND\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-k8s:
    needs: build-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read        # pull from GHCR inside the kind cluster
    env:
      OWNER: ${{ needs.build-push.outputs.owner }}
      BACKEND_REF: ghcr.io/${{ needs.build-push.outputs.owner }}/civicpulse-backend@${{ needs.build-push.outputs.backend-digest }}
      FRONTEND_REF: ghcr.io/${{ needs.build-push.outputs.owner }}/civicpulse-frontend@${{ needs.build-push.outputs.frontend-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: verify signatures before deploying
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/cd.yml@refs/heads/main
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          for ref in "$BACKEND_REF" "$FRONTEND_REF"; do
            cosign verify "$ref" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "verified $ref"
          done

      - name: create ephemeral kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          version: v0.25.0
          config: k8s/kind-config.yaml
          cluster_name: civicpulse
          wait: 120s
      - name: install kustomize (pinned)
        run: |
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin kustomize
      - name: cluster add-ons (ingress-nginx, metrics-server, VPA CRD)
        run: ./scripts/cluster-addons.sh

      - name: namespace, secrets from GitHub Secrets, GHCR pull secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          # Ephemeral cluster: fall back to a random password if the repo secret isn't set.
          pw="${POSTGRES_PASSWORD:-$(openssl rand -hex 24)}"
          echo "::add-mask::$pw"
          kubectl -n civicpulse create secret generic civicpulse-secrets \
            --from-literal=POSTGRES_PASSWORD="$pw" \
            --from-literal=LLM_API_KEY="${LLM_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n civicpulse create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n civicpulse patch serviceaccount default -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: render overlays/prod pinned to the image digests
        run: |
          cd k8s/overlays/prod
          kustomize edit set image "civicpulse-backend=$BACKEND_REF" "civicpulse-frontend=$FRONTEND_REF"
          kustomize build . > "$RUNNER_TEMP/rendered.yaml"
          if grep -nE 'image: .*(:latest|set-by-cd|/OWNER/)' "$RUNNER_TEMP/rendered.yaml"; then
            echo "::error::refusing to deploy a mutable or placeholder image reference"; exit 1
          fi
          grep -n 'image: ' "$RUNNER_TEMP/rendered.yaml" | sort -u
      - name: apply
        run: kubectl apply -f "$RUNNER_TEMP/rendered.yaml"
      - name: wait for rollout
        run: |
          kubectl -n civicpulse rollout status statefulset/postgres --timeout=240s
          kubectl -n civicpulse rollout status deployment/redis --timeout=180s
          kubectl -n civicpulse rollout status deployment/backend --timeout=300s
          kubectl -n civicpulse rollout status deployment/frontend --timeout=180s
      - name: smoke test through the Ingress
        run: ./scripts/smoke.sh http://127.0.0.1 civicpulse.local
      - name: what is running
        run: |
          kubectl -n civicpulse get pods -o wide
          kubectl -n civicpulse get hpa
          kubectl -n civicpulse get deploy -o custom-columns='NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image'
          {
            echo "### Deployed commit \`${GITHUB_SHA}\`"
            echo '```'
            kubectl -n civicpulse get hpa
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: rendered-manifests-${{ github.sha }}
          path: ${{ runner.temp }}/rendered.yaml
      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl -n civicpulse get all,pvc,ingress,events --sort-by=.lastTimestamp || true
          kubectl -n civicpulse describe pods || true
          kubectl -n civicpulse logs deploy/backend --all-containers --tail=100 || true

# Release — on a semver tag (git tag v1.2.0 && git push origin v1.2.0):
# test → build + push semver tags (same digest as the commit's SHA tag) → GitHub Release with notes.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # create the GitHub Release
      packages: write        # push semver tags to GHCR
      id-token: write        # cosign keyless
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/civicpulse-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - run: cosign sign --yes "ghcr.io/${{ steps.owner.outputs.owner }}/civicpulse-${{ matrix.image }}@${{ steps.push.outputs.digest }}"
      - name: record digest for the release notes
        run: echo "ghcr.io/${{ steps.owner.outputs.owner }}/civicpulse-${{ matrix.image }}@${{ steps.push.outputs.digest }}" > "digest-${{ matrix.image }}.txt"
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: digest-${{ matrix.image }}
          path: digest-${{ matrix.image }}.txt

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: digest-*
          merge-multiple: true
      - name: compose release body
        run: |
          {
            echo "## Images"
            echo '```'
            cat digest-*.txt
            echo '```'
            echo "Deploy by digest, e.g. \`kustomize edit set image civicpulse-backend=$(cat digest-backend.txt)\`"
          } > body.md
      - uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8bb048 # v2.2.0
        with:
          body_path: body.md
          generate_release_notes: true
